[project]
name = "medo"
version = "0.2.0"
description = "Medo — AI Career Intelligence Platform"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools]
packages = ["backend", "backend.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
