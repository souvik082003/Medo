name: Nexus AI CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python bytecode compilation & app import
        run: |
          python -m compileall -q backend scripts
          USE_STUB_EMBEDDINGS=true LLM_PROVIDER=mock python -c "from backend.app.main import app; assert app is not None"

      - name: Verify Alembic migrations
        env:
          DATABASE_URL: sqlite:////tmp/nexus_ci_alembic.db
        run: alembic -c backend/alembic.ini upgrade head

      - name: Run pytest suite (when tests directory is present)
        env:
          USE_STUB_EMBEDDINGS: "true"
          LLM_PROVIDER: "mock"
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "tests/ is gitignored; skipping pytest on CI."
          fi

      - name: Run offline reproducible benchmark suite
        env:
          USE_STUB_EMBEDDINGS: "true"
          LLM_PROVIDER: "mock"
        run: python -m backend.app.evaluation.run_all

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Production Next.js build
        run: npm run build
